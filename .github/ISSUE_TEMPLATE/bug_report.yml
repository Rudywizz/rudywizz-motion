name: 🐞 Bug report
description: Something renders wrong, crashes or won't install
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks! A command we can run ourselves is the fastest way to a fix.
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command (and composition JSON, if any)
      render: shell
      placeholder: npx rudywizz-motion render neon-sign --text "Hello" --camera orbit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
      description: Attach a still (`rudywizz-motion still … --at 2`) or a short clip if it's visual.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rudywizz-motion doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: via
    attributes:
      label: How do you run it?
      options: [CLI, Claude Code plugin, npx skills (other agent), Other]
    validations:
      required: true
