name: Pages

on:
  push:
    branches: [main]
    paths: ['gallery/**', 'scripts/build-site.mjs', 'skills/rudywizz-motion/styles/**', 'skills/rudywizz-motion/templates/**', '.github/logo/**', '.github/workflows/pages.yml', 'package.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
