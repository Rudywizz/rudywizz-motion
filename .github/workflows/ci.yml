name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Render every style (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # OS package managers instead of a third-party action (fewer moving parts, no API rate limits)
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - run: node skills/rudywizz-motion/engine/cli.mjs doctor
      - name: Generated files are up to date
        if: runner.os == 'Linux'
        run: |
          npm run skills
          git diff --exit-code -- skills/ || (echo "::error::Run 'npm run skills' and commit the result" && exit 1)
          node scripts/build-site.mjs "$RUNNER_TEMP/site"
      - name: Smoke tests
        run: node scripts/smoke.mjs ${{ runner.os != 'Linux' && '--quick' || '' }}
