<style>

  canvas { display: block; }
  body.preview { background: #0c0c0c; display: grid; place-items: center; height: 100vh; font: 12px ui-monospace, monospace; color: #888; }

  #bar { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; }
  #err { position: fixed; inset: 0; color: #ff5a4f; padding: 24px; white-space: pre-wrap; font: 14px ui-monospace, monospace; }
</style>
